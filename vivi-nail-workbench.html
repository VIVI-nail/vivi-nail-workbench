<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIVI美甲工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg-page:#f5f1ea;--bg-card:#fff;--bg-sidebar:#f8f5ef;
--text-main:#2a2a2a;--text-sub:#8a8a8a;--text-light:#b5b0a8;
--accent:#2a2a2a;--accent-red:#e85a4f;--line:#ebe6dd;
--tag-rose:#d4a89a;--tag-rose-light:#f0d9d0;
--tag-blue:#a8b5c4;--tag-blue-light:#d4dce6;
--tag-green:#9bb3a0;--tag-green-light:#d4e0d6;
--tag-yellow:#c9b58a;--tag-yellow-light:#ebe0c8;
--sidebar-w:260px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg-page);color:var(--text-main);min-height:100vh;display:flex;overflow-x:hidden}
.icon{width:16px;height:16px;display:inline-block;vertical-align:middle;fill:currentColor;flex-shrink:0}
.icon-lg{width:20px;height:20px}.icon-sm{width:13px;height:13px}
.sidebar{width:var(--sidebar-w);background:var(--bg-sidebar);height:100vh;position:fixed;left:0;top:0;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:100;transition:transform .3s}
.sidebar-header{display:flex;align-items:center;padding:24px 24px 20px;border-bottom:1px solid var(--line);gap:0}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{width:38px;height:38px;background:var(--tag-rose);color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;flex-shrink:0}
.brand-text{line-height:1.3}
.brand-name{font-size:18px;font-weight:600;letter-spacing:.5px}
.brand-sub{font-size:10px;color:var(--text-sub);letter-spacing:2px}
.back-home{display:flex;align-items:center;gap:8px;padding:12px 16px;margin:18px 14px;background:#fff;border-radius:12px;font-size:13px;color:var(--text-main);border:1px solid var(--line);cursor:pointer;transition:all .2s}
.back-home:hover{background:#f0ebe2}
.menu{flex:1;overflow-y:auto;padding:0 10px 20px}
.menu::-webkit-scrollbar{width:4px}.menu::-webkit-scrollbar-thumb{background:#d8d2c6;border-radius:4px}
.menu-section{font-size:11px;color:var(--text-sub);padding:16px 12px 8px;letter-spacing:1px}
.menu-item{display:flex;align-items:center;gap:12px;padding:10px 14px;margin:2px 0;border-radius:10px;font-size:13px;color:var(--text-main);cursor:pointer;transition:all .2s}
.menu-item:hover{background:rgba(0,0,0,.03)}
.menu-item.active{background:#2a2a2a;color:#fff}
.menu-item.active .icon,.menu-item.active .menu-icon{color:#fff}
.menu-icon{color:var(--text-sub);display:inline-flex}
.sidebar-footer{padding:14px 20px;font-size:11px;color:var(--text-light);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.sync-status{display:flex;align-items:center;gap:6px;font-size:11px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--tag-green)}
.sync-dot.offline{background:var(--tag-yellow)}
.login-btn{padding:8px 12px;background:var(--tag-rose);color:#fff;border:none;border-radius:8px;font-size:12px;cursor:pointer;width:100%}
.menu-toggle{display:none;position:fixed;top:16px;left:16px;z-index:200;width:44px;height:44px;background:#fff;border:1px solid var(--line);border-radius:10px;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;padding:24px 32px 100px;position:relative;max-width:calc(100vw - var(--sidebar-w));transition:margin-left .3s,max-width .3s}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-title-wrap{display:flex;align-items:center;gap:12px;flex:1}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:#fff;border:1px solid var(--line);border-radius:10px;font-size:13px;cursor:pointer;color:var(--text-main);transition:all .2s}
.back-btn:hover{background:#f0ebe2}
.page-title{font-size:22px;font-weight:600;letter-spacing:.5px}
.page-date{font-size:13px;color:var(--text-sub)}
.card{background:var(--bg-card);border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid var(--line)}
.card-title{font-size:16px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.card-title-sub{font-size:12px;color:var(--text-sub);font-weight:400}
.quick-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.quick-card{background:#fff;border-radius:16px;padding:22px 20px;border:1px solid var(--line);cursor:pointer;transition:transform .2s,box-shadow .2s;display:flex;align-items:center;gap:16px}
.quick-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.04)}
.quick-card-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.qc-rose{background:var(--tag-rose)}.qc-yellow{background:var(--tag-yellow)}.qc-green{background:var(--tag-green)}.qc-blue{background:var(--tag-blue)}
.quick-card-content{flex:1}.quick-card-title{font-size:15px;font-weight:600;margin-bottom:4px}.quick-card-desc{font-size:11px;color:var(--text-sub);line-height:1.5}
.tab-bar{display:flex;gap:8px;margin:20px 0 16px;flex-wrap:wrap}
.tab-btn{padding:8px 18px;background:#fff;border:1px solid var(--line);border-radius:20px;font-size:13px;color:var(--text-main);cursor:pointer;transition:all .2s}
.tab-btn.active{background:#2a2a2a;color:#fff;border-color:#2a2a2a}
.data-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.data-card{background:#fff;border-radius:16px;padding:20px;border:1px solid var(--line);position:relative;overflow:hidden}
.data-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%}
.dc-rose::before{background:var(--tag-rose)}.dc-yellow::before{background:var(--tag-yellow)}.dc-green::before{background:var(--tag-green)}.dc-blue::before{background:var(--tag-blue)}
.data-card-label{font-size:12px;color:var(--text-sub);margin-bottom:10px}
.data-card-value{font-size:28px;font-weight:600;margin-bottom:8px;letter-spacing:-.5px}
.data-card-sub{font-size:11px;color:var(--text-sub)}
.analysis-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.analysis-item{background:#faf7f1;border-radius:12px;padding:18px;border:1px solid var(--line)}
.analysis-label{font-size:12px;color:var(--text-sub);margin-bottom:10px}
.analysis-value{font-size:24px;font-weight:600;margin-bottom:6px}
.analysis-sub{font-size:11px;color:var(--text-sub)}
.section-toolbar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search-input{flex:1;min-width:180px;padding:10px 16px;background:#fff;border:1px solid var(--line);border-radius:10px;font-size:13px;outline:0;font-family:inherit}
.search-input:focus{border-color:var(--text-main)}
.btn{padding:10px 20px;border-radius:10px;font-size:13px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--text-main);font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:all .2s;white-space:nowrap}
.btn:hover{background:#f0ebe2}
.btn-dark{background:#2a2a2a;color:#fff;border-color:#2a2a2a}
.btn-dark:hover{background:#1a1a1a}
.btn-red{background:var(--accent-red);color:#fff;border-color:var(--accent-red)}
.btn-red:hover{background:#d44a3f}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-ghost{background:0 0;border:1px solid var(--line);color:var(--text-sub)}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;padding:14px 12px;background:#faf7f1;font-weight:500;color:var(--text-sub);font-size:12px}
.table th:first-child{border-radius:10px 0 0 10px}.table th:last-child{border-radius:0 10px 10px 0}
.table td{padding:14px 12px;border-top:1px solid var(--line)}
.table tr:hover td{background:#faf7f1}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;background:#f0ebe2;color:var(--text-main)}
.tag-pending{background:#fdf3d8;color:#b58a3a}.tag-done{background:#d8ebde;color:#5a8a6e}.tag-confirm{background:#d4dce6;color:#4a6a8a}.tag-rose{background:var(--tag-rose-light);color:#a06655}
.customer-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.customer-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;transition:all .2s}
.customer-card:hover{box-shadow:0 6px 16px rgba(0,0,0,.05);transform:translateY(-2px)}
.customer-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--tag-rose-light),var(--tag-blue-light));display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:600;flex-shrink:0}
.customer-name{font-size:15px;font-weight:600}.customer-phone{font-size:11px;color:var(--text-sub);margin-top:2px}
.customer-info{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px}
.info-row{display:flex;flex-direction:column;gap:2px}.info-label{color:var(--text-sub);font-size:11px}.info-value{color:var(--text-main)}
.discount-badge{display:inline-block;padding:2px 8px;background:var(--tag-rose-light);color:#a06655;border-radius:8px;font-size:10px;font-weight:600;margin-top:4px}
.staff-list{display:flex;flex-direction:column;gap:10px}
.staff-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#faf7f1;border-radius:10px;flex-wrap:wrap}
.staff-dot{width:10px;height:10px;border-radius:50%;background:var(--tag-rose);flex-shrink:0}
.staff-name{font-size:14px;font-weight:500;flex:1}.staff-role{font-size:12px;color:var(--text-sub)}.staff-actions{display:flex;gap:6px}
.member-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.summary-card{background:#faf7f1;border-radius:12px;padding:18px;border:1px solid var(--line)}
.summary-label{font-size:12px;color:var(--text-sub);margin-bottom:8px}.summary-value{font-size:24px;font-weight:600}.summary-sub{font-size:11px;color:var(--text-sub);margin-top:4px}
.member-list{display:flex;flex-direction:column;gap:12px}
.member-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.member-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:10px}
.member-info{display:flex;align-items:center;gap:12px}.member-name{font-size:15px;font-weight:600}.member-phone{font-size:12px;color:var(--text-sub)}.member-balance{font-size:13px;color:var(--tag-rose);font-weight:600}
.member-cards{display:flex;gap:10px;flex-wrap:wrap}
.card-chip{background:#faf7f1;border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:12px}.card-chip-name{color:var(--text-main);font-weight:500}.card-chip-info{color:var(--text-sub);font-size:11px;margin-top:2px}
.cal-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-head{text-align:center;font-size:12px;color:var(--text-sub);padding:8px 0;font-weight:500}
.cal-cell{min-height:90px;background:#faf7f1;border:1px solid var(--line);border-radius:8px;padding:6px;font-size:12px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;gap:4px}
.cal-cell:hover{background:#f0ebe2}.cal-cell.other-month{opacity:.4}.cal-cell.today{border-color:var(--tag-rose);background:#fdf6f3}
.cal-date{font-weight:600;font-size:13px}
.cal-apt{background:var(--tag-rose-light);color:#a06655;padding:2px 6px;border-radius:4px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.discount-info{background:#faf7f1;border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.discount-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.discount-row.total{border-top:1px dashed var(--line);margin-top:6px;padding-top:10px;font-weight:600;font-size:15px}
.discount-row .val{color:var(--tag-rose);font-weight:600}
.chart-container{background:#faf7f1;border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid var(--line)}
.chart-bars{display:flex;align-items:flex-end;gap:12px;height:200px;margin-top:16px}
.chart-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.chart-bar-fill{width:100%;background:linear-gradient(180deg,var(--tag-rose-light),var(--tag-rose));border-radius:6px 6px 0 0;min-height:4px}
.chart-bar-label{font-size:11px;color:var(--text-sub)}.chart-bar-value{font-size:11px;color:var(--text-main);font-weight:500}
.ranking-list{display:flex;flex-direction:column;gap:10px}
.ranking-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#faf7f1;border-radius:10px}
.rank-num{width:24px;height:24px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--text-sub)}
.rank-num.top{background:var(--tag-rose);color:#fff}
.rank-content{flex:1;min-width:0}.rank-name{font-size:14px;font-weight:500}
.rank-bar-wrap{height:4px;background:#fff;border-radius:2px;margin-top:6px;overflow:hidden}
.rank-bar{height:100%;background:var(--tag-rose);border-radius:2px}
.rank-value{font-size:14px;font-weight:600;color:var(--text-main);white-space:nowrap}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
.form-label{font-size:12px;color:var(--text-sub)}
.form-input,.form-select,.form-textarea{padding:10px 14px;background:#faf7f1;border:1px solid var(--line);border-radius:10px;font-size:13px;outline:0;font-family:inherit;color:var(--text-main)}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--text-main);background:#fff}
.form-textarea{resize:vertical;min-height:80px}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:16px;font-weight:600}
.modal-close{width:28px;height:28px;border-radius:8px;background:#faf7f1;border:none;cursor:pointer;color:var(--text-sub);display:flex;align-items:center;justify-content:center}
.modal-body{padding:24px}.modal-footer{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.fab{position:fixed;right:32px;bottom:32px;width:56px;height:56px;border-radius:50%;background:var(--accent-red);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px rgba(232,90,79,.3);z-index:50;border:none;transition:transform .2s}
.fab:hover{transform:scale(1.05)}
.fab-menu{position:fixed;right:32px;bottom:100px;background:#fff;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.1);padding:8px;display:none;flex-direction:column;gap:4px;z-index:50;min-width:160px;border:1px solid var(--line)}
.fab-menu.show{display:flex}
.fab-menu-item{padding:10px 14px;border-radius:8px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:10px;color:var(--text-main)}
.fab-menu-item:hover{background:#faf7f1}.fab-menu-item .icon{color:var(--tag-rose)}
.empty{text-align:center;padding:40px 20px;color:var(--text-sub);background:#faf7f1;border-radius:12px;font-size:13px}
.service-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.service-chip{padding:10px 12px;background:#faf7f1;border:1px solid var(--line);border-radius:10px;font-size:12px;cursor:pointer;transition:all .2s;text-align:center;line-height:1.4}
.service-chip:hover{background:#f0ebe2;border-color:var(--tag-rose)}
.service-chip.selected{background:var(--tag-rose-light);border-color:var(--tag-rose);color:#a06655;font-weight:600}
.service-chip .chip-price{display:block;font-size:10px;color:var(--tag-rose);margin-top:2px;font-weight:500}
.filter-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:flex-end}
.filter-bar .form-group{margin-bottom:0}
.filter-bar .form-input,.filter-bar .form-select{padding:8px 12px;font-size:12px;min-width:0;flex-shrink:0}
.filter-date{max-width:140px}
.filter-keyword{max-width:180px}
.filter-type{max-width:130px}
.strike{text-decoration:line-through;color:var(--text-sub)}
.income-text{color:var(--tag-green)}.expense-text{color:var(--accent-red)}
.row{display:flex;gap:10px;align-items:center}.row-between{display:flex;justify-content:space-between;align-items:center}
.text-sub{color:var(--text-sub)}.text-sm{font-size:12px}.hidden{display:none}.scroll-x{overflow-x:auto}

/* 响应式 */
@media(max-width:1024px){
.quick-cards{grid-template-columns:repeat(2,1fr)}.data-cards{grid-template-columns:repeat(2,1fr)}
.analysis-grid{grid-template-columns:repeat(2,1fr)}.member-summary{grid-template-columns:1fr}.cal-cell{min-height:80px}
}
@media(min-width:769px) and (max-width:1024px){
.sidebar{width:240px}.main{margin-left:240px;max-width:calc(100vw - 240px);padding:20px 24px 100px}
.quick-cards{grid-template-columns:repeat(2,1fr);gap:12px}
.customer-list{grid-template-columns:repeat(2,1fr)}.modal{max-width:580px}
.form-input,.form-select{padding:12px 16px;font-size:14px}.btn{padding:12px 22px;font-size:14px}
.fab{width:60px;height:60px;right:28px;bottom:28px}.fab-menu{right:28px;bottom:100px}
}
@media(min-width:1025px) and (max-width:1366px){
.main{padding:28px 40px 100px}.quick-cards{gap:16px}.customer-list{grid-template-columns:repeat(3,1fr)}.modal{max-width:640px}
}
/* 手机端：侧边栏展开时主区域右移 */
@media(max-width:768px){
.menu-toggle{display:flex}
.sidebar{transform:translateX(-100%)}
.sidebar.open{transform:translateX(0)}
.sidebar.open ~ .main{margin-left:var(--sidebar-w);max-width:calc(100vw - var(--sidebar-w))}
.main{margin-left:0;max-width:100vw;padding:70px 16px 100px;transition:margin-left .3s,max-width .3s}
.quick-cards{grid-template-columns:1fr 1fr;gap:10px}.data-cards{grid-template-columns:1fr 1fr;gap:10px}
.analysis-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}
.page-title{font-size:18px}.quick-card{padding:16px 14px}.quick-card-title{font-size:14px}.quick-card-desc{display:none}
.cal-grid{gap:3px}.cal-cell{min-height:60px;padding:4px;font-size:10px}.cal-date{font-size:11px}.cal-apt{font-size:9px}
.fab{right:16px;bottom:16px;width:52px;height:52px}.fab-menu{right:16px;bottom:80px}
.service-picker{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
.filter-bar{flex-direction:column}.filter-bar .form-input,.filter-bar .form-select{max-width:100%}
.staff-item{flex-direction:column;align-items:flex-start}.staff-actions{width:100%;justify-content:flex-end}
}
@media(max-width:480px){
.quick-cards{grid-template-columns:1fr}.data-cards{grid-template-columns:1fr}
.page-header{flex-direction:column;align-items:flex-start}.cal-cell{min-height:50px}
}
</style>
</head>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<symbol id="i-home" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></symbol>
<symbol id="i-grip" viewBox="0 0 24 24"><path fill="currentColor" d="M4 4h4v4H4V4zm6 0h4v4h-4V4zm6 0h4v4h-4V4zM4 10h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4zM4 16h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4z"/></symbol>

/* Supabase REST 调用：upsert 一行数据（key=用户名） */
async function supaUpsert(user,data){
if(!supaConfig)return false;
const url=`${supaConfig.url}/rest/v1/vivi_data?key=eq.${encodeURIComponent(user)}`;
const headers={
'apikey':supaConfig.anonKey,
'Authorization':`Bearer ${supaConfig.anonKey}`,
'Content-Type':'application/json',
'Prefer':'resolution=merge-duplicates'
};
try{
const r=await fetch(url,{method:'PATCH',headers,body:JSON.stringify({data})});
return r.ok;
}catch(e){return false}
}

/* Supabase REST 调用：读取一行数据 */
async function supaFetch(user){
if(!supaConfig)return null;
const url=`${supaConfig.url}/rest/v1/vivi_data?key=eq.${encodeURIComponent(user)}&select=data`;
const headers={'apikey':supaConfig.anonKey,'Authorization':`Bearer ${supaConfig.anonKey}`};
try{
const r=await fetch(url,{headers});
if(!r.ok)return null;
const arr=await r.json();
if(arr&&arr.length>0&&arr[0].data)return arr[0].data;
return null;
}catch(e){return null}
}

if(cloudChannel){cloudChannel.postMessage({type:'sync',data:store,user:auth.user,ts:Date.now()})}
// 防抖上传到 Supabase（2秒内多次只上传一次）
if(syncTimer)clearTimeout(syncTimer);
syncTimer=setTimeout(()=>{
supaUpsert(auth.user,store).then(ok=>{
if(ok)console.log('[云端]已同步');
else console.warn('[云端]上传失败');
});
},2000);
}
updateSyncStatus()
}catch(e){}
}

async function saveSupaConfigFromForm(){
const url=document.getElementById('supa_url').value.trim();
const anonKey=document.getElementById('supa_key').value.trim();
if(!url||!anonKey){alert('请填写 URL 和 anon key');return}
// 先尝试用 REST API 检查表是否存在
const btn=document.getElementById('supaSaveBtn');
btn.disabled=true;btn.textContent='检测中...';
const checkUrl=`${url.replace(/\/$/,'')}/rest/v1/vivi_data?select=key&limit=1`;
const headers={'apikey':anonKey,'Authorization':`Bearer ${anonKey}`};
let tableExists=false;
try{
const r=await fetch(checkUrl,{headers});
tableExists=r.ok;
}catch(e){tableExists=false}
if(!tableExists){
btn.textContent='尝试建表...';
// 通过 RPC 或直接提示用户手动建表
// Supabase REST API 不支持 DDL，用 mgmt API 建表
const mgmtUrl=`${url.replace(/\/$/,'')}/rest/v1/rpc/`;
// 降级：提示用户
alert('自动建表未成功。\n\n请手动操作：\n1. 打开 Supabase 控制台\n2. 左侧菜单 → SQL Editor\n3. 粘贴下方 SQL 并 Run：\n\nCREATE TABLE vivi_data (\n  key TEXT PRIMARY KEY,\n  data JSONB,\n  updated_at TIMESTAMPTZ DEFAULT now()\n);\n\n配置已保存，建表后可正常使用。');
}
saveSupaConfig({url:url.replace(/\/$/,''),anonKey});
btn.disabled=false;btn.textContent='保存并自动建表';
closeModal();
updateSyncStatus();
if(tableExists){
alert('Supabase 配置成功！\n表已存在，可直接使用。');
}else{
alert('Supabase 配置已保存\n表未找到，请去 Supabase 控制台 SQL Editor 建表');
}
setTimeout(openLogin,100);
}

/* ===== 拉取/上传云端数据 ===== */
async function pullCloudData(){
const auth=getAuth();if(!auth)return;
// 优先从 Supabase 拉取
if(supaConfig){
const btn=event?.target;if(btn){btn.disabled=true;btn.innerHTML='<svg class="icon icon-sm"><use href="#i-download"/></svg> 拉取中...'}
const cloudData=await supaFetch(auth.user);
if(btn){btn.disabled=false;btn.innerHTML='<svg class="icon icon-sm"><use href="#i-download"/></svg> 拉取云端数据'}
if(!cloudData){
// Supabase 无数据，回退本地
const localCloud=localStorage.getItem('vivi_cloud_'+auth.user);
if(!localCloud){alert('云端暂无数据（首次使用请先「上传本地到云端」）');return}
if(!confirm('Supabase 未拉到数据，本地缓存有数据，是否用本地缓存？'))return;
localStorage.setItem(STORAGE_KEY,localCloud);
loadData();refreshPage();closeModal();alert('已加载本地缓存数据');return;
}
if(!confirm('拉取云端数据将覆盖当前本地数据，确认？'))return;
store=cloudData;
localStorage.setItem(STORAGE_KEY,JSON.stringify(cloudData));
localStorage.setItem('vivi_cloud_'+auth.user,JSON.stringify(cloudData));
refreshPage();closeModal();alert('已从 Supabase 拉取云端数据');
}else{
// 无 Supabase，用本地缓存
const cloudKey='vivi_cloud_'+auth.user;
const cloudData=localStorage.getItem(cloudKey);
if(!cloudData){alert('云端暂无数据');return}
if(!confirm('拉取云端数据将覆盖当前本地数据，确认？'))return;
localStorage.setItem(STORAGE_KEY,cloudData);
loadData();refreshPage();closeModal();alert('已拉取云端数据')
}
}

async function pushCloudData(){
const auth=getAuth();if(!auth)return;
const btn=event?.target;if(btn){btn.disabled=true;btn.innerHTML='<svg class="icon icon-sm"><use href="#i-cloud"/></svg> 上传中...'}
if(supaConfig){
const ok=await supaUpsert(auth.user,store);
if(btn){btn.disabled=false;btn.innerHTML='<svg class="icon icon-sm"><use href="#i-cloud"/></svg> 上传本地到云端'}
if(!ok){alert('上传失败，请检查 Supabase 配置和表是否创建');return}
// 同时更新本地缓存
localStorage.setItem('vivi_cloud_'+auth.user,JSON.stringify(store));
if(cloudChannel){cloudChannel.postMessage({type:'sync',data:store,user:auth.user,ts:Date.now()})}
closeModal();alert('已上传到 Supabase 云端\n其他设备登录同一账号即可同步');
}else{
const cloudKey='vivi_cloud_'+auth.user;
localStorage.setItem(cloudKey,JSON.stringify(store));
if(cloudChannel){cloudChannel.postMessage({type:'sync',data:store,user:auth.user,ts:Date.now()})}
if(btn){btn.disabled=false;btn.innerHTML='<svg class="icon icon-sm"><use href="#i-cloud"/></svg> 上传本地到云端'}
closeModal();alert('已上传到本地云端\n其他设备登录同一账号后点击「拉取云端数据」即可同步')
}
}

/* ===== 初始化：BroadcastChannel + 定时备份 + 网络监听 ===== */
function initCloudSync(){
try{
cloudChannel=new BroadcastChannel('vivi_cloud_sync');
cloudChannel.onmessage=(e)=>{
if(e.data&&e.data.type==='sync'&&e.data.data){
store=e.data.data;
try{localStorage.setItem(STORAGE_KEY,JSON.stringify(store))}catch(e2){}
if(e.data.user){try{localStorage.setItem('vivi_cloud_'+e.data.user,JSON.stringify(store))}catch(e3){}}
refreshPage()
}}
}catch(e){}
// 定时本地备份
setInterval(()=>{
const backups=JSON.parse(localStorage.getItem('vivi_backups')||'[]');
backups.unshift({time:new Date().toISOString(),data:store});
if(backups.length>20)backups.length=20;
localStorage.setItem('vivi_backups',JSON.stringify(backups))
},5*60*1000);
window.addEventListener('online',()=>{document.getElementById('syncDot').classList.remove('offline');document.getElementById('syncText').textContent=getAuth()?(supaConfig?'云端已连接 · '+getAuth().user:'本地已同步 · '+getAuth().user):'本地已保存'});
window.addEventListener('offline',()=>{document.getElementById('syncDot').classList.add('offline');document.getElementById('syncText').textContent='离线模式 · 暂存本地'})
}

function updateHomeTabs(){
const active=document.querySelector('.tab-btn.active');
const tab=active?active.textContent:'今日数据';
const todayStr=today.toISOString().slice(0,10);
const thisMonth=todayStr.slice(0,7);
const thisYear=todayStr.slice(0,4);
const fin=store.finance||[];
let income,expense,net,label,subLabel,titlePrefix;
if(tab==='今日数据'){
const todayFin=fin.filter(f=>f.date===todayStr);
income=todayFin.filter(f=>f.type==='income').reduce((s,f)=>s+f.amount,0);
expense=todayFin.filter(f=>f.type==='expense').reduce((s,f)=>s+f.amount,0);
label='今日';subLabel=todayStr;titlePrefix='今日';
}else if(tab==='本月数据'){
const monthFin=fin.filter(f=>f.date.startsWith(thisMonth));
income=monthFin.filter(f=>f.type==='income').reduce((s,f)=>s+f.amount,0);
expense=monthFin.filter(f=>f.type==='expense').reduce((s,f)=>s+f.amount,0);
label='本月';subLabel=thisMonth;titlePrefix='本月';
}else{
const yearFin=fin.filter(f=>f.date.startsWith(thisYear));
income=yearFin.filter(f=>f.type==='income').reduce((s,f)=>s+f.amount,0);
expense=yearFin.filter(f=>f.type==='expense').reduce((s,f)=>s+f.amount,0);
label='本年';subLabel=thisYear;titlePrefix='本年';
}
net=income-expense;
// 筛选今日/本月/本年的预约
let filteredApts;
if(tab==='今日数据')filteredApts=store.appointments.filter(a=>a.date===todayStr);
else if(tab==='本月数据')filteredApts=store.appointments.filter(a=>a.date.startsWith(thisMonth));
else filteredApts=store.appointments.filter(a=>a.date.startsWith(thisYear));
const doneApts=filteredApts.filter(a=>a.status==='done');
const pendingApts=filteredApts.filter(a=>a.status==='pending');
const doneIncome=doneApts.reduce((s,a)=>s+(a.price||0),0);
const avgPrice=doneApts.length?Math.round(doneIncome/doneApts.length):0;
const completeRate=filteredApts.length?Math.round(doneApts.length/filteredApts.length*100):0;
// 最热项目
const serviceCount={};
filteredApts.forEach(a=>{const svc=a.service||'';serviceCount[svc]=(serviceCount[svc]||0)+1});
const topService=Object.entries(serviceCount).sort((a,b)=>b[1]-a[1])[0];
const cardsHtml=`<div class="data-card dc-rose"><div class="data-card-label">${label}收入</div><div class="data-card-value">¥${income}</div><div class="data-card-sub">${subLabel}</div></div>
<div class="data-card dc-yellow"><div class="data-card-label">${label}支出</div><div class="data-card-value">¥${expense}</div><div class="data-card-sub">含工资 / 耗材</div></div>
<div class="data-card dc-green"><div class="data-card-label">${label}净营收</div><div class="data-card-value" style="color:${net>=0?'var(--tag-green)':'var(--accent-red)'}">¥${net}</div><div class="data-card-sub">收入 − 支出</div></div>
<div class="data-card dc-blue"><div class="data-card-label">${label}预约</div><div class="data-card-value">${filteredApts.length}</div><div class="data-card-sub">已完成 ${doneApts.length} · 待处理 ${pendingApts.length}</div></div>`;
const analysisHtml=`<div class="analysis-item"><div class="analysis-label">${titlePrefix}到店</div><div class="analysis-value">${filteredApts.length}</div><div class="analysis-sub">已完成 ${doneApts.length} · 待到店 ${pendingApts.length}</div></div>
<div class="analysis-item"><div class="analysis-label">完成率</div><div class="analysis-value">${completeRate}%</div><div class="analysis-sub">${doneApts.length} / ${filteredApts.length} 单</div></div>

function calcDuration(start,end){const[sh,sm]=start.split(':').map(Number),[eh,em]=end.split(':').map(Number);const mins=(eh*60+em)-(sh*60+sm);if(mins<=0)return'-';const h=Math.floor(mins/60),m=mins%60;return(h>0?h+'小时':'')+(m>0?m+'分':'')}
function filterApt(q){q=q.toLowerCase();document.querySelectorAll('#aptTbody tr').forEach(tr=>{tr.style.display=(tr.dataset.name.toLowerCase().includes(q)||tr.dataset.phone.includes(q))?'':'none'})}

function renderAptCalendarView(){
const year=calCurrentDate.getFullYear(),month=calCurrentDate.getMonth();
const firstDay=new Date(year,month,1),lastDay=new Date(year,month+1,0);
const startWeekday=firstDay.getDay()===0?6:firstDay.getDay()-1;
const daysInMonth=lastDay.getDate(),prevMonthDays=new Date(year,month,0).getDate();
const todayStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
let cells='';
['周一','周二','周三','周四','周五','周六','周日'].forEach(w=>cells+=`<div class="cal-head">${w}</div>`);
for(let i=startWeekday-1;i>=0;i--)cells+=`<div class="cal-cell other-month"><div class="cal-date">${prevMonthDays-i}</div></div>`;
for(let d=1;d<=daysInMonth;d++){
const dateStr2=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const dayApts=store.appointments.filter(a=>a.date===dateStr2);
const isToday=dateStr2===todayStr;
cells+=`<div class="cal-cell ${isToday?'today':''}" onclick="showDayApt('${dateStr2}')"><div class="cal-date">${d}</div>${dayApts.slice(0,3).map(a=>`<div class="cal-apt">${a.startTime} ${a.customer}</div>`).join('')}${dayApts.length>3?`<div class="cal-apt" style="text-align:center">+${dayApts.length-3}</div>`:''}</div>`
}
const totalCells=startWeekday+daysInMonth,remain=(7-totalCells%7)%7;
for(let i=1;i<=remain;i++)cells+=`<div class="cal-cell other-month"><div class="cal-date">${i}</div></div>`;
return`<div class="cal-toolbar">
<button class="btn" onclick="changeCalMonth(-1)"><svg class="icon icon-sm"><use href="#i-angle-left"/></svg></button>
<div style="font-size:16px;font-weight:600;min-width:140px;text-align:center">${year}年${month+1}月</div>
<button class="btn" onclick="changeCalMonth(1)"><svg class="icon icon-sm"><use href="#i-angle-right"/></svg></button>
<div style="flex:1"></div><button class="btn btn-sm" onclick="calGoToday()">今天</button>
<button class="btn btn-dark btn-sm" onclick="navigateTo('appointment-new')"><svg class="icon icon-sm"><use href="#i-plus"/></svg> 新建</button></div>
<div class="card" style="padding:14px"><div class="cal-grid">${cells}</div></div>
<div class="text-sm text-sub" style="margin-top:8px">点击日期查看当日全部预约</div>`
}
function changeCalMonth(delta){calCurrentDate=new Date(calCurrentDate.getFullYear(),calCurrentDate.getMonth()+delta,1);document.getElementById('aptViewArea').innerHTML=renderAptCalendarView()}
function calGoToday(){calCurrentDate=new Date(today.getFullYear(),today.getMonth(),1);document.getElementById('aptViewArea').innerHTML=renderAptCalendarView()}
function showDayApt(date){
const dayApts=store.appointments.filter(a=>a.date===date);
const html=dayApts.length?`<div style="display:flex;flex-direction:column;gap:10px"><div class="text-sm text-sub">${date} 共 ${dayApts.length} 条预约</div>${dayApts.map(a=>`<div style="background:#faf7f1;padding:12px;border-radius:10px"><div style="font-weight:600;margin-bottom:4px">${a.startTime}-${a.endTime} · ${a.customer}</div><div class="text-sm text-sub">${a.service} · 技师：${a.staff}</div><span class="tag ${a.status==='confirm'?'tag-confirm':'tag-pending'}" style="margin-top:6px">${a.status==='confirm'?'已确认':'待确认'}</span></div>`).join('')}</div>`:`<div class="empty">该日期暂无预约</div>`;
openModalContent(date+' 预约汇总',html,`<button class="btn btn-dark" onclick="closeModal();navigateTo('appointment-new')">新建预约</button>`)
}

/* ========== 会员扣卡（含检索+台账筛选+会员删除） ========== */
function renderMember(){
const flows=store.memberFlow.slice().sort((a,b)=>b.date.localeCompare(a.date));
return`<div class="section-toolbar"><input class="search-input" placeholder="搜索会员姓名 / 手机号" id="searchMember" oninput="filterMembers()" /><button class="btn" onclick="exportBackup()"><svg class="icon icon-sm"><use href="#i-download"/></svg> 导出备份</button></div>
<div class="member-summary">
<div class="summary-card"><div class="summary-label">会员总数</div><div class="summary-value">${store.members.length}</div><div class="summary-sub">本月新增 ${store.members.length}</div></div>
<div class="summary-card"><div class="summary-label">储值总余额</div><div class="summary-value">¥${store.members.reduce((s,m)=>s+m.balance,0)}</div><div class="summary-sub">活跃卡 ${store.members.filter(m=>m.cards.length).length} 张</div></div>
<div class="summary-card"><div class="summary-label">次卡剩余</div><div class="summary-value">${store.members.reduce((s,m)=>s+m.cards.reduce((a,c)=>a+(c.total-c.used),0),0)} 次</div><div class="summary-sub">含美甲 / 美睫</div></div></div>
<div class="card"><div class="card-title">会员折扣体系</div><div class="scroll-x"><table class="table"><thead><tr><th>会员等级</th><th>折扣</th><th>说明</th></tr></thead><tbody>${Object.entries(MEMBER_LEVELS).map(([k,v])=>`<tr><td>${k}</td><td><span class="tag tag-rose">${v.label}</span></td><td class="text-sm text-sub">消费享 ${v.discount===1?'原价':(v.discount*10)+'折'} 优惠</td></tr>`).join('')}</tbody></table></div></div>
<div class="card"><div class="card-title">会员列表</div><div class="member-list" id="memberList">${store.members.map(m=>renderMemberItem(m)).join('')}</div></div>
<div class="card"><div class="card-title">消费历史台账<span class="card-title-sub">按日期倒序 · 筛选</span></div>
<div class="filter-bar">
<div class="form-group"><label class="form-label">开始日期</label><input class="form-input filter-date" type="date" id="flowDateStart" onchange="filterFlows()" /></div>
<div class="form-group"><label class="form-label">结束日期</label><input class="form-input filter-date" type="date" id="flowDateEnd" onchange="filterFlows()" /></div>
<div class="form-group"><label class="form-label">关键词</label><input class="form-input filter-keyword" placeholder="项目/顾客名" id="flowKeyword" oninput="filterFlows()" /></div>
<div class="form-group"><label class="form-label">消费类型</label><select class="form-select filter-type" id="flowType" onchange="filterFlows()"><option value="">全部</option><option value="充值">充值</option><option value="扣次">扣次消费</option></select></div>
<button class="btn btn-sm btn-ghost" onclick="resetFlowFilter()">重置筛选</button>
</div>
<div class="scroll-x"><table class="table"><thead><tr><th>消费日期</th><th>顾客</th><th>服务项目</th><th>原价</th><th>折扣</th><th>实付</th><th>类型</th></tr></thead><tbody id="flowTbody">${flows.map(f=>renderFlowRow(f)).join('')}</tbody></table></div></div>`
}
function renderMemberItem(m){
const level=MEMBER_LEVELS[m.level]||MEMBER_LEVELS['普通会员'];
return`<div class="member-item" data-name="${m.name}" data-phone="${m.phone}">
<div class="member-head"><div class="member-info"><div class="avatar">${m.name[0]}</div><div><div class="member-name">${m.name} <span class="discount-badge">${m.level} · ${level.label}</span></div><div class="member-phone">${m.phone}</div></div></div>
<div class="row" style="gap:8px"><div class="member-balance">余额 ¥${m.balance}</div><button class="btn btn-sm btn-dark" style="background:var(--tag-green)" onclick="rechargeMember(${m.id})">储值</button><button class="btn btn-sm btn-dark" onclick="deductCard(${m.id})">扣卡结算</button><button class="btn btn-sm btn-red" onclick="deleteMember(${m.id})">删除</button></div></div>
<div class="member-cards">${m.cards.length?m.cards.map((c,i)=>`<div class="card-chip"><div class="card-chip-name">${c.name}</div><div class="card-chip-info">${c.total-c.used} / ${c.total} 次</div><button class="btn btn-sm btn-ghost" style="padding:2px 8px;font-size:11px;margin-left:6px" onclick="deleteMemberCard(${m.id},${i})">删除</button></div>`).join(''):'<div class="text-sm text-sub">暂无卡项 · <a onclick="addMemberCard(${m.id})" style="color:var(--tag-rose);cursor:pointer">点击添加</a></div>'}<button class="btn btn-sm btn-ghost" style="margin-left:8px;padding:2px 10px;font-size:11px" onclick="addMemberCard(${m.id})">+ 添加卡项</button></div></div>`
}
function renderFlowRow(f){
return`<tr data-date="${f.date}" data-customer="${f.customer}" data-type="${f.type}" data-content="${f.content}">
<td>${f.date}</td><td>${f.customer}</td><td>${f.content}</td>
<td class="${f.type==='充值'?'':'strike'}">¥${f.originalPrice}</td>
<td><span class="tag tag-rose">${f.discount}</span></td>
<td style="font-weight:600;color:var(--tag-rose)">¥${f.paid}</td>
<td><span class="tag ${f.type==='充值'?'tag-done':'tag-pending'}">${f.type}</span></td></tr>`
}
function filterFlows(){
const start=document.getElementById('flowDateStart')?.value||'';
const end=document.getElementById('flowDateEnd')?.value||'';
const keyword=(document.getElementById('flowKeyword')?.value||'').toLowerCase();
const type=document.getElementById('flowType')?.value||'';
document.querySelectorAll('#flowTbody tr').forEach(tr=>{
let match=true;
if(start&&tr.dataset.date<start)match=false;
if(end&&tr.dataset.date.slice(0,10)>end)match=false;
if(keyword&&!tr.dataset.customer.toLowerCase().includes(keyword)&&!tr.dataset.content.toLowerCase().includes(keyword))match=false;
if(type&&tr.dataset.type!==type)match=false;
tr.style.display=match?'':'none'
})
}
function resetFlowFilter(){
const els=['flowDateStart','flowDateEnd','flowKeyword','flowType'];
els.forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});
filterFlows()
}
function filterMembers(){const q=document.getElementById('searchMember').value.toLowerCase();document.querySelectorAll('#memberList .member-item').forEach(item=>{item.style.display=(item.dataset.name.toLowerCase().includes(q)||item.dataset.phone.includes(q))?'':'none'})}
function deleteMember(id){
const m=store.members.find(x=>x.id===id);if(!m)return;
if(!confirm(`确认删除会员「${m.name}」？\n该会员的全部消费记录也将同步删除。`))return;
store.members=store.members.filter(x=>x.id!==id);
store.memberFlow=store.memberFlow.filter(f=>f.customer!==m.name);
// 同步清理顾客档案的会员标记
const cust=store.customers.find(c=>c.name===m.name);
if(cust)cust.member='普通会员';
saveData();navigateTo('member');alert('已删除会员及关联消费记录')
}
function deleteMemberCard(memberId,cardIdx){
const m=store.members.find(x=>x.id===memberId);if(!m)return;
const c=m.cards[cardIdx];if(!c)return;
if(!confirm(`确认删除卡项「${c.name}」？\n剩余 ${c.total-c.used} 次将作废。`))return;
m.cards.splice(cardIdx,1);
saveData();navigateTo('member');alert('已删除卡项「'+c.name+'」')
}
function addMemberCard(memberId){
const m=store.members.find(x=>x.id===memberId);if(!m)return;
const html=`<div style="display:flex;flex-direction:column;gap:14px">
<div class="form-group"><label class="form-label">卡项名称</label><input class="form-input" id="newCardName" placeholder="如：美甲次卡" value="美甲次卡" /></div>
<div class="form-group"><label class="form-label">总次数</label><input class="form-input" type="number" min="1" id="newCardTotal" value="10" /></div>
<div class="form-group"><label class="form-label">已用次数</label><input class="form-input" type="number" min="0" id="newCardUsed" value="0" /></div>
</div>`;
openModalContent('添加卡项 - '+m.name,html,`<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-dark" onclick="confirmAddCard(${memberId})">添加</button>`)
}
function confirmAddCard(memberId){
const m=store.members.find(x=>x.id===memberId);if(!m)return;
const name=document.getElementById('newCardName').value.trim()||'新卡项';
const total=parseInt(document.getElementById('newCardTotal').value)||1;
const used=parseInt(document.getElementById('newCardUsed').value)||0;
if(used>total){alert('已用次数不能超过总次数');return}
m.cards.push({name,total,used});
saveData();closeModal();navigateTo('member');alert('已添加卡项「'+name+'」')
}
function deductCard(id){
const m=store.members.find(x=>x.id===id);
const level=MEMBER_LEVELS[m.level]||MEMBER_LEVELS['普通会员'];
_deductMemberId=id;
const payMethods=m.balance>0?`<option value="card">次卡扣次</option><option value="balance">储值余额支付</option><option value="cash">现金/扫码</option>`:`<option value="card">次卡扣次</option><option value="cash">现金/扫码</option>`;
const html=`<div style="display:flex;flex-direction:column;gap:14px">
<div class="text-sm">顾客：<b>${m.name}</b> · ${m.level}（${level.label}） · 储值余额 ¥${m.balance}</div>
<div class="form-group"><label class="form-label">结算方式</label><select class="form-select" id="deductMethod" onchange="updateDeductPreview()">${payMethods}</select></div>
<div class="form-group" id="cardSelectGroup"><label class="form-label">选择卡项</label><select class="form-select" id="deductCardSelect" onchange="updateDeductPreview()">${m.cards.map((c,i)=>`<option value="${i}">${c.name} (剩余 ${c.total-c.used}/${c.total})</option>`).join('')}</select></div>
<div class="form-group"><label class="form-label">扣减次数 / 服务数量</label><input class="form-input" type="number" min="1" value="1" id="deductCount" oninput="updateDeductPreview()" /></div>
<div class="form-group"><label class="form-label">服务项目</label><input class="form-input" id="deductService" placeholder="如：法式美甲" value="法式美甲" /></div>
<div class="form-group"><label class="form-label">原价（元）</label><input class="form-input" type="number" id="deductPrice" value="280" oninput="updateDeductPreview()" /></div>
<div class="discount-info" id="deductPreview"></div></div>`;
openModalContent('会员扣卡结算',html,`<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-dark" onclick="confirmDeduct(${id})">确认结算</button>`);
setTimeout(updateDeductPreview,50)
}
function updateDeductPreview(){
const m=store.members.find(x=>x.id===_deductMemberId);if(!m)return;
const level=MEMBER_LEVELS[m.level]||MEMBER_LEVELS['普通会员'];
const method=document.getElementById('deductMethod')?.value||'card';
const price=parseFloat(document.getElementById('deductPrice').value)||0;
const count=parseInt(document.getElementById('deductCount').value)||1;
const original=price*count;
const cardSelectGroup=document.getElementById('cardSelectGroup');
if(cardSelectGroup)cardSelectGroup.style.display=method==='card'?'':'none';
let previewHtml='';
if(method==='card'){
const cardIdx=parseInt(document.getElementById('deductCardSelect')?.value||0);
const card=m.cards[cardIdx];
const remaining=card?card.total-card.used:0;
const enough=card&&remaining>=count;
previewHtml=`<div class="discount-row"><span>原价</span><span>¥${original}</span></div><div class="discount-row"><span>会员折扣</span><span class="val">${level.label}</span></div><div class="discount-row"><span>优惠金额</span><span class="val">-¥${original-Math.round(original*level.discount)}</span></div><div class="discount-row total"><span>折后实付</span><span class="val">¥${Math.round(original*level.discount)}</span></div><div class="discount-row"><span>次卡剩余</span><span class="val" style="color:${enough?'var(--tag-green)':'var(--accent-red)'}">${remaining} 次 ${enough?'':'(不足！)'}</span></div>`;
}else if(method==='balance'){
const paid=Math.round(original*level.discount);
const balanceAfter=m.balance-paid;
previewHtml=`<div class="discount-row"><span>原价</span><span>¥${original}</span></div><div class="discount-row"><span>会员折扣</span><span class="val">${level.label}</span></div><div class="discount-row"><span>折后扣减</span><span class="val">-¥${paid}</span></div><div class="discount-row total"><span>储值余额变化</span><span class="val">¥${m.balance} → ¥${balanceAfter}</span></div><div class="discount-row"><span style="color:${balanceAfter>=0?'var(--tag-green)':'var(--accent-red)'}">${balanceAfter>=0?'余额充足':'余额不足！需补 ¥'+(-balanceAfter)}</span></div>`;
}else{
previewHtml=`<div class="discount-row"><span>原价</span><span>¥${original}</span></div><div class="discount-row"><span>会员折扣</span><span class="val">${level.label}</span></div><div class="discount-row"><span>优惠金额</span><span class="val">-¥${original-Math.round(original*level.discount)}</span></div><div class="discount-row total"><span>应收金额</span><span class="val">¥${Math.round(original*level.discount)}</span></div>`;
}
document.getElementById('deductPreview').innerHTML=previewHtml
}
let _deductMemberId=null;
function confirmDeduct(id){
const m=store.members.find(x=>x.id===id);
const method=document.getElementById('deductMethod').value;
const count=parseInt(document.getElementById('deductCount').value)||1;
const service=document.getElementById('deductService').value||'服务';
const price=parseFloat(document.getElementById('deductPrice').value)||0;
const level=MEMBER_LEVELS[m.level]||MEMBER_LEVELS['普通会员'];
const original=price*count,paid=Math.round(original*level.discount);
const now=new Date();
const dateStr2=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
if(method==='card'){
const cardIdx=parseInt(document.getElementById('deductCardSelect').value);
const card=m.cards[cardIdx];if(!card){alert('请选择卡项');return}
if(card.used+count>card.total){alert('剩余次数不足');return}
card.used+=count;
store.memberFlow.unshift({date:dateStr2,customer:m.name,type:'扣次',content:`${card.name} ×${count} · ${service}`,originalPrice:original,discount:level.label,paid,balance:`剩余 ${card.total-card.used} 次`});
saveData();closeModal();navigateTo('member');alert(`扣卡成功\n${card.name} ×${count}\n原价 ¥${original} · ${level.label} · 实付 ¥${paid}`)
}else if(method==='balance'){
if(m.balance<paid){alert('储值余额不足\n当前余额 ¥'+m.balance+' · 需要 ¥'+paid);return}
m.balance-=paid;
store.memberFlow.unshift({date:dateStr2,customer:m.name,type:'扣次',content:`储值支付 · ${service} ×${count}`,originalPrice:original,discount:level.label,paid,balance:`余额 ¥${m.balance}`});
saveData();closeModal();navigateTo('member');alert(`储值扣减成功\n${service} ×${count}\n原价 ¥${original} · ${level.label} · 实付 ¥${paid}\n余额：¥${m.balance}`)
}else{
store.memberFlow.unshift({date:dateStr2,customer:m.name,type:'扣次',content:`现金/扫码 · ${service} ×${count}`,originalPrice:original,discount:level.label,paid,balance:`现金收讫`});
saveData();closeModal();navigateTo('member');alert(`结算成功\n${service} ×${count}\n原价 ¥${original} · ${level.label} · 实付 ¥${paid}`)
}
}

/* ===== 会员储值 ===== */
const RECHARGE_PRESETS_KEY='vivi_recharge_presets';
const DEFAULT_RECHARGE_PRESETS=[
{amount:500,giftAmount:0,giftItem:''},
{amount:1000,giftAmount:50,giftItem:''},
{amount:2000,giftAmount:200,giftItem:''},
{amount:3000,giftAmount:500,giftItem:''},
{amount:5000,giftAmount:1000,giftItem:''}
];
function getRechargePresets(){
try{return JSON.parse(localStorage.getItem(RECHARGE_PRESETS_KEY))||DEFAULT_RECHARGE_PRESETS}catch(e){return DEFAULT_RECHARGE_PRESETS}
}
function saveRechargePresets(arr){try{localStorage.setItem(RECHARGE_PRESETS_KEY,JSON.stringify(arr))}catch(e){}}
let _rechargePresets=getRechargePresets();
function rechargeMember(id){
const m=store.members.find(x=>x.id===id);if(!m)return;
_rechargeMemberId=id;
const presets=_rechargePresets;
const html=`<div style="display:flex;flex-direction:column;gap:14px">
<div class="text-sm">顾客：<b>${m.name}</b> · ${m.level} · 当前余额 ¥${m.balance}</div>
<div class="form-group"><label class="form-label" style="display:flex;justify-content:space-between;align-items:center">储值方案（点选）<button class="btn btn-sm btn-ghost" style="padding:2px 8px;font-size:11px" onclick="openRechargePresetEditor()">编辑方案</button></label>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">
${presets.map((p,i)=>{const giftText=p.giftAmount>0?'赠 ¥'+p.giftAmount:'无赠送';const itemText=p.giftItem?' · '+p.giftItem:'';return `<div onclick="selectRechargePreset(${i})" id="preset_${i}" style="padding:12px;border:2px solid var(--line);border-radius:10px;cursor:pointer;text-align:center;transition:all .2s"><div style="font-weight:600;font-size:15px">¥${p.amount}</div><div style="font-size:11px;color:var(--tag-rose);margin-top:2px">${giftText}${itemText}</div></div>`}).join('')}
<div onclick="selectRechargePreset(-1)" id="preset_custom" style="padding:12px;border:2px solid var(--line);border-radius:10px;cursor:pointer;text-align:center;transition:all .2s"><div style="font-weight:600;font-size:15px">自定义</div><div style="font-size:11px;color:var(--text-sub);margin-top:2px">手动输入</div></div>
</div></div>

function confirmRecharge(id){
const m=store.members.find(x=>x.id===id);if(!m)return;
const amount=parseFloat(document.getElementById('rechargeAmount').value)||0;
const gift=parseFloat(document.getElementById('rechargeGift').value)||0;
const giftItem=document.getElementById('rechargeGiftItem').value.trim();
const note=document.getElementById('rechargeNote').value.trim();
if(amount<=0){alert('请填写储值金额');return}
const total=amount+gift;
const beforeBalance=m.balance;
m.balance+=total;
// 如果有赠送项目，自动添加为卡项
if(giftItem){
m.cards.push({name:giftItem,total:1,used:0});
}
const now=new Date();
const dateStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
let content=`储值 ¥${amount}`;
if(gift>0)content+=` + 赠送 ¥${gift}`;
if(giftItem)content+=` + 赠送「${giftItem}」`;
if(note)content+=` · ${note}`;
store.memberFlow.unshift({date:dateStr,customer:m.name,type:'充值',content,originalPrice:amount,discount:gift>0?'赠送':'-',paid:total,balance:`余额 ¥${m.balance}`});
saveData();closeModal();navigateTo('member');alert(`储值成功\n${content}\n余额：¥${beforeBalance} → ¥${m.balance}`)
}

if(tab==='今日数据'){const tf=fin.filter(f=>f.date===todayStr);income=tf.filter(f=>f.type==='income').reduce((s,f)=>s+f.amount,0);expense=tf.filter(f=>f.type==='expense').reduce((s,f)=>s+f.amount,0);label='今日';sub=todayStr}
else if(tab==='本月数据'){const mf=fin.filter(f=>f.date.startsWith(thisMonth));income=mf.filter(f=>f.type==='income').reduce((s,f)=>s+f.amount,0);expense=mf.filter(f=>f.type==='expense').reduce((s,f)=>s+f.amount,0);label='本月';sub=thisMonth}
else{const yf=fin.filter(f=>f.date.startsWith(thisYear));income=yf.filter(f=>f.type==='income').reduce((s,f)=>s+f.amount,0);expense=yf.filter(f=>f.type==='expense').reduce((s,f)=>s+f.amount,0);label='本年';sub=thisYear}
const net=income-expense;
const filtered=tab==='今日数据'?fin.filter(f=>f.date===todayStr):tab==='本月数据'?fin.filter(f=>f.date.startsWith(thisMonth)):fin.filter(f=>f.date.startsWith(thisYear));
const cardsEl=document.getElementById('analyticsCards');
if(cardsEl)cardsEl.innerHTML=`
<div class="data-card dc-rose"><div class="data-card-label">${label}收入</div><div class="data-card-value">¥${income}</div><div class="data-card-sub">${sub}</div></div>
<div class="data-card dc-yellow"><div class="data-card-label">${label}支出</div><div class="data-card-value">¥${expense}</div><div class="data-card-sub">含工资 / 耗材</div></div>
<div class="data-card dc-green"><div class="data-card-label">${label}净营收</div><div class="data-card-value" style="color:${net>=0?'var(--tag-green)':'var(--accent-red)'}">¥${net}</div><div class="data-card-sub">收入 - 支出</div></div>
<div class="data-card dc-blue"><div class="data-card-label">${label}笔数</div><div class="data-card-value">${filtered.length}</div><div class="data-card-sub">收入 ${filtered.filter(f=>f.type==='income').length} · 支出 ${filtered.filter(f=>f.type==='expense').length}</div></div>`;
}

function openFinanceModal(){
const todayDate=today.toISOString().slice(0,10);
const html=`
<div style="display:flex;flex-direction:column;gap:14px">
<div class="form-group"><label class="form-label">收支类型 *</label><select class="form-select" id="fin_type" onchange="toggleFinanceType()"><option value="income">收入</option><option value="expense">支出</option></select></div>
<div class="form-group"><label class="form-label">分类</label><select class="form-select" id="fin_category"><option>美甲服务</option><option>美睫服务</option><option>套餐</option><option>产品售卖</option></select></div>
<div class="form-group" id="finStaffGroup" style="display:none"><label class="form-label">关联店员</label><select class="form-select" id="fin_staff">${store.staff.map(s=>`<option>${s.name}</option>`).join('')}</select></div>
<div class="form-group"><label class="form-label">金额（元）*</label><input class="form-input" type="number" id="fin_amount" placeholder="0" min="0" /></div>
<div class="form-group"><label class="form-label">日期 *</label><input class="form-input" type="date" id="fin_date" value="${todayDate}" /></div>
<div class="form-group"><label class="form-label">顾客 / 对象</label><input class="form-input" id="fin_customer" placeholder="顾客姓名或支出对象" /></div>
<div class="form-group full"><label class="form-label">备注</label><textarea class="form-textarea" id="fin_note" placeholder="说明"></textarea></div>
</div>`;
const footer=`<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-dark" onclick="saveFinance()">保存记录</button>`;
openModalContent('新增收支记录',html,footer)
}

function toggleFinanceType(){
const type=document.getElementById('fin_type')?.value;
const cat=document.getElementById('fin_category');
const staffG=document.getElementById('finStaffGroup');
if(type==='expense'){
if(cat)cat.innerHTML='<option>员工日结</option><option>耗材采购</option><option>房租水电</option><option>其他支出</option>';
if(staffG)staffG.style.display='flex'
}else{
if(cat)cat.innerHTML='<option>美甲服务</option><option>美睫服务</option><option>套餐</option><option>产品售卖</option><option>其他收入</option>';
if(staffG)staffG.style.display='none'
}
}

function saveFinance(){
const type=document.getElementById('fin_type').value;
const amount=parseFloat(document.getElementById('fin_amount').value)||0;
const date=document.getElementById('fin_date').value;
if(!amount||!date){alert('请填写金额和日期');return}
const record={
id:store.nextId.finance++,
date,
type,
category:document.getElementById('fin_category').value,
amount,
customer:document.getElementById('fin_customer').value.trim()||'',
staff:type==='expense'?(document.getElementById('fin_staff')?.value||''):'',
note:document.getElementById('fin_note').value.trim()||''
};
if(!store.finance)store.finance=[];
store.finance.push(record);
saveData();closeModal();navigateTo('analytics');alert('记录已保存')
}

function deleteFinance(id){
if(!confirm('确认删除该条收支记录？\n此操作不影响会员消费台账。'))return;
store.finance=store.finance.filter(f=>f.id!==id);
saveData();navigateTo('analytics')
}

function filterFinance(q){
q=q.toLowerCase();
document.querySelectorAll('#financeTbody tr').forEach(tr=>{
tr.style.display=tr.dataset.search.toLowerCase().includes(q)?'':'none'
})
}
function filterFinanceType(type){
document.querySelectorAll('#financeTbody tr').forEach(tr=>{
tr.style.display=(!type||tr.dataset.type===type)?'':'none'
})
}

/* ========== 模态框 ========== */
function openModal(type){
let title='',html='',footer='';
if(type==='appointment'){
title='新建预约';
html=`<div class="form-grid"><div class="form-group"><label class="form-label">顾客姓名</label><input class="form-input" id="m_apt_name" /></div><div class="form-group"><label class="form-label">联系电话</label><input class="form-input" id="m_apt_phone" /></div><div class="form-group full"><label class="form-label">服务项目</label><input class="form-input" id="m_apt_service" /></div><div class="form-group"><label class="form-label">技师</label><select class="form-select" id="m_apt_staff">${store.staff.map(s=>`<option>${s.name}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">日期</label><input class="form-input" type="date" id="m_apt_date" value="${today.toISOString().slice(0,10)}" /></div><div class="form-group"><label class="form-label">开始时间</label><input class="form-input" type="time" id="m_apt_start" value="10:00" /></div><div class="form-group"><label class="form-label">结束时间</label><input class="form-input" type="time" id="m_apt_end" value="12:00" /></div></div>`;
footer=`<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-dark" onclick="saveModalApt()">保存</button>`
}else if(type==='customer'){
title='新增会员';
html=`<div class="form-grid"><div class="form-group"><label class="form-label">姓名</label><input class="form-input" id="m_cust_name" /></div><div class="form-group"><label class="form-label">电话</label><input class="form-input" id="m_cust_phone" /></div><div class="form-group"><label class="form-label">会员等级</label><select class="form-select" id="m_cust_member">${Object.keys(MEMBER_LEVELS).map(l=>`<option>${l}</option>`).join('')}</select></div><div class="form-group full"><label class="form-label">偏好</label><input class="form-input" id="m_cust_pref" /></div></div>`;
footer=`<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-dark" onclick="saveModalCust()">保存</button>`
}else if(type==='staff'){
title='添加员工';
html=`<div class="form-grid"><div class="form-group"><label class="form-label">姓名</label><input class="form-input" id="m_staff_name" /></div><div class="form-group"><label class="form-label">岗位</label><select class="form-select" id="m_staff_role"><option>美甲师</option><option>美睫师</option><option>前台</option></select></div><div class="form-group full"><label class="form-label">联系电话</label><input class="form-input" id="m_staff_phone" /></div></div>`;
footer=`<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-dark" onclick="saveModalStaff()">保存</button>`
}
openModalContent(title,html,footer)
}
function saveModalApt(){
const name=document.getElementById('m_apt_name').value.trim(),phone=document.getElementById('m_apt_phone').value.trim();
if(!name||!phone){alert('请填写姓名和电话');return}
store.appointments.push({id:store.nextId.appointment++,customer:name,phone,service:document.getElementById('m_apt_service').value||'服务',staff:document.getElementById('m_apt_staff').value,date:document.getElementById('m_apt_date').value,startTime:document.getElementById('m_apt_start').value,endTime:document.getElementById('m_apt_end').value,status:'pending',price:0});
saveData();closeModal();alert('预约已创建')
}
function saveModalCust(){
const name=document.getElementById('m_cust_name').value.trim(),phone=document.getElementById('m_cust_phone').value.trim();
if(!name||!phone){alert('请填写姓名和电话');return}
const member=document.getElementById('m_cust_member').value;
store.customers.push({id:store.nextId.customer++,name,phone,skin:'自然肤色',preference:document.getElementById('m_cust_pref').value||'-',history:'-',consumption:0,visits:0,member});
store.members.push({id:store.nextId.member++,name,phone,level:member,balance:0,cards:[]});
saveData();closeModal();alert('顾客已添加')
}
function saveModalStaff(){
const name=document.getElementById('m_staff_name').value.trim();if(!name){alert('请填写姓名');return}
store.staff.push({id:store.nextId.staff++,name,role:document.getElementById('m_staff_role').value,phone:document.getElementById('m_staff_phone').value.trim()});
saveData();closeModal();alert('员工已添加');if(document.querySelector('.menu-item.active')?.dataset.page==='staff')navigateTo('staff')
}
function openModalContent(title,html,footer='',showFooter=true){
document.getElementById('modalTitle').textContent=title;
document.getElementById('modalBody').innerHTML=html;
document.getElementById('modalFooter').innerHTML=footer;
document.getElementById('modalFooter').style.display=showFooter?'flex':'none';
document.getElementById('modalOverlay').classList.add('show')
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}
